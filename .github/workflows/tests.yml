name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        # Live tests are excluded deliberately: CI has no RPC endpoint and
        # must not make network calls. Excluding by marker rather than
        # relying on a runtime skip, so the intent is stated rather than
        # accidental.
        run: pytest tests/ -v -m "not live"